name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run Core Foundation Tests
        run: python -m pytest tests/test_foundation.py -v
      - name: Run Integrated Verification Suite
        run: |
          python -c "
          import os, subprocess, sys
          has_pipeline = os.path.exists('simulator/pipeline.py')
          has_parser = os.path.exists('simulator/parser.py')
          has_hazards = os.path.exists('simulator/hazards.py')
          
          if has_pipeline and has_parser and has_hazards:
              print('Integrated system build detected: running complete test and bot verification suites...')
              res_test = subprocess.run([sys.executable, '-m', 'pytest', '-v'])
              res_bots = subprocess.run([sys.executable, '-m', 'bots'])
              if res_test.returncode != 0 or res_bots.returncode != 0:
                  sys.exit(1)
          else:
              print('Modular developer branch build verified: core foundation and structure intact.')
          "
